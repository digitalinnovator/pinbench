# Isolated, hash-locked environment for the Harbor CLI.
#
# pinbench talks to Harbor only through its CLI and on-disk job format
# (docs/adr/0002-execution-via-harbor.md). Keeping Harbor in its own lockfile
# keeps its large dependency tree, including LiteLLM, out of pinbench's own
# environment, and lets the Harbor version move independently of pinbench.
#
#   uv sync --project tools/harbor --frozen
#   uv run --project tools/harbor --frozen harbor --version
[project]
name = "pinbench-harbor-tool"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.23.0",
    # Pinned deliberately rather than left to the resolver. LiteLLM's PyPI
    # package was compromised on 2026-03-24, so it gets the same scrutiny as any
    # other LLM-tooling dependency. Harbor 0.23.0's own lock uses 1.93.0, which
    # ships Linux wheels only; 1.93.2 is the same minor line, public since
    # 2026-08-09, with wheels for macOS and Linux.
    "litellm==1.93.2",
]

[tool.uv]
package = false
exclude-newer = "2026-09-26T00:00:00Z"
# Wheels only: never run a package's build script on the operator's machine.
no-build = true
# Some upstreams have stopped publishing Intel-Mac wheels. Constrain only that
# platform to the last release with one; Linux and Apple Silicon stay current.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
