name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check src tests benchmarks
      - run: uv run ruff format --check src tests benchmarks
      - run: uv run mypy
      - run: uv run pytest -m "not docker"
      # Every benchmark task, proved offline: the reference passes, the careless solution fails.
      - run: uv run python scripts/check_task.py examples/benchmark-suite/tasks/*

  harbor-integration:
    # Real Harbor trials in Docker with the zero-cost oracle and nop agents. No API keys.
    name: harbor integration (docker)
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv sync --frozen --project tools/harbor
      - run: uv run pytest -m docker -v
