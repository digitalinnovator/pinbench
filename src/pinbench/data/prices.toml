# Price table used to re-price token usage (ADR-0005). US dollars per million tokens.
#
# Every number was read from its provider's pricing page on the `verified` date. Update the
# numbers and `version` together; the version and this file's SHA-256 are recorded in every run
# bundle.
#
# Not covered, so trials that use them are left un-priced instead of priced wrongly:
#   - fast or priority tiers, which have their own prices
#   - requests above a model's long-context threshold, which are priced higher
#   - Bedrock, Vertex AI and other resellers, which set their own prices
#   - batch and flex discounts (harnesses do not use them)

version = "2026-10-18"
verified = 2026-10-18

[sources]
anthropic = "https://platform.claude.com/docs/en/about-claude/pricing"
openai = "https://developers.openai.com/api/docs/pricing"

[modifiers]
# Multiplier on every token category when inference is pinned to the US (Claude 4.6 and later).
inference_geo_us_multiplier = 1.1
web_search_usd_per_1000 = 10.0

# ---- Anthropic. Cache writes are 1.25x (5 minutes) and 2x (1 hour) the input price.

[models.claude-fable-5-1]
input = 10.0
cache_write_5m = 12.50
cache_write_1h = 20.0
cache_read = 0.25
output = 50.0

