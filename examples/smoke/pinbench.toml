# Step 1 of the benchmark plan: one real trial per knob and per cap, on one small demo task.
# Each line below is its own `pinbench run`, so each knob is checked in isolation.
#
#   pinbench run <pin> -c examples/smoke --env-file .env --dry-run     # worst case; spends nothing
#
# What to look for in each trial (docs/benchmark/plan.md, gate after step 1):
#   h45            baseline: tokens, cost and transcript recorded, version proven
#   h45-terse      the appended system prompt reaches the harness (shorter replies)
#   h45-no-cache   zero cache-read and cache-write tokens
#   h45-turn-cap   stops at its turn cap: harness_stop = error_max_turns, cost still recorded
#   h45-spend-cap  stops at its dollar cap: harness_stop = error_max_budget_usd, cost recorded
#   s5-high        effort reaches the API on Sonnet 5
#   s5-low         and lowers output and tool calls against s5-high

[suite]
name = "smoke"
tasks_dir = "../demo-suite/tasks"
include = ["parse-duration"]

[runner]
kind = "harbor"
harbor_command = ["uv", "run", "--project", "../../tools/harbor", "--frozen", "harbor"]
environment = "docker"
n_concurrent = 1
agent_setup_timeout_multiplier = 2.0

[pins.h45]
harness = "claude-code"
version = "2.1.283"
model = "anthropic/claude-haiku-4-5"
options = { max_budget_usd = "0.08", max_turns = 20 }

[pins.h45-terse]
harness = "claude-code"
version = "2.1.283"
model = "anthropic/claude-haiku-4-5"
options = { max_budget_usd = "0.08", max_turns = 20, append_system_prompt = "Keep every response under 25 words. Do not explain your reasoning, restate the task or summarise your changes." }

[pins.h45-no-cache]
harness = "claude-code"
version = "2.1.283"
model = "anthropic/claude-haiku-4-5"
options = { max_budget_usd = "0.15", max_turns = 20 }
env = { DISABLE_PROMPT_CACHING = "1" }

# A turn cap low enough to fire on any real attempt.
[pins.h45-turn-cap]
harness = "claude-code"
version = "2.1.283"
model = "anthropic/claude-haiku-4-5"
options = { max_budget_usd = "0.08", max_turns = 1 }

# A dollar cap low enough to fire after the first request.
[pins.h45-spend-cap]
harness = "claude-code"
version = "2.1.283"
model = "anthropic/claude-haiku-4-5"
options = { max_budget_usd = "0.005", max_turns = 20 }

[pins.s5-high]
harness = "claude-code"
version = "2.1.283"
model = "anthropic/claude-sonnet-5"
options = { reasoning_effort = "high", max_budget_usd = "0.15", max_turns = 20 }

[pins.s5-low]
harness = "claude-code"
version = "2.1.283"
model = "anthropic/claude-sonnet-5"
options = { reasoning_effort = "low", max_budget_usd = "0.15", max_turns = 20 }

# --- Step 3: do builds from the postmortem dates still run against today's API? One trial each.
