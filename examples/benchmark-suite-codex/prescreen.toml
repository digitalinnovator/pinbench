# Codex track of the benchmark (docs/benchmark/plan.md, OpenAI pool). The tasks are generated:
#
#   python scripts/derive_codex_suite.py      # copies examples/benchmark-suite/tasks, adds Codex
#
# Codex has no per-trial dollar cap, so every trial is bounded by an agent timeout and the
# ledger reserves `reserve_usd` per trial. $0.05 is about 6x the dearest Codex trial measured
# (18 benchmark tasks and 6 demo tasks, 2026-10-20: at most $0.0088 in 157 s) and about 3x a
# trial that runs the whole 300 s timeout at that rate.

[suite]
name = "benchmark-codex-prescreen"
tasks_dir = "tasks"
# Step C1, the Codex headroom check: all 32 candidate tasks, both efforts, 2 attempts each.
# These trials are calibration: they choose the Codex tasks and never enter a test.

[runner]
kind = "harbor"
harbor_command = ["uv", "run", "--project", "../../tools/harbor", "--frozen", "harbor"]
environment = "docker"
n_concurrent = 4
agent_setup_timeout_multiplier = 2.0
harness_cache = false

[stats]
alpha = 0.05
alternative = "less"
mixture_max = 0.8
warmup_batches = 1

[budget]
max_usd = 7.0
max_batches = 1
attempts_per_batch = 2

# gpt-6-luna, standard tier. 300 s per trial: the benchmark tasks take Sonnet 5 about 2 minutes.
[pins.codex-high]
harness = "codex"
version = "0.163.0"
model = "openai/gpt-6-luna"
options = { reasoning_effort = "high", web_search = "disabled", config = { service_tier = "default" } }
timeout_sec = 300
reserve_usd = 0.05

[pins.codex-low]
harness = "codex"
version = "0.163.0"
model = "openai/gpt-6-luna"
options = { reasoning_effort = "low", web_search = "disabled", config = { service_tier = "default" } }
timeout_sec = 300
reserve_usd = 0.05

[pins.oracle]
harness = "oracle"

[pins.nop]
harness = "nop"
