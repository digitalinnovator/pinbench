# A simulated comparison: no Docker, no API keys, no spend. Useful for trying the CLI and for
# planning budgets. The runner draws outcomes from the pass rates below, with per-task
# difficulty so that pairing matters (see agent_canary/runners/simulated.py).
#
#   canary compare stable regressed -c examples/simulated

[suite]
name = "simulated-demo"
tasks_dir = "../demo-suite/tasks"

[runner]
kind = "simulated"
simulated_task_spread = 0.5

[runner.simulated.stable]
pass_rate = 0.75
cost_usd = 0.42
input_tokens = 180000
output_tokens = 7000
agent_seconds = 95.0

# A harness update that loses ~25 points of pass rate and burns more tokens.
[runner.simulated.regressed]
pass_rate = 0.50
cost_usd = 0.55
input_tokens = 240000
output_tokens = 9500
agent_seconds = 120.0

[stats]
alpha = 0.05
alternative = "less"

[budget]
max_usd = 150.0
max_batches = 20
attempts_per_batch = 4

[pins.stable]
harness = "claude-code"
version = "2.1.283"
model = "anthropic/claude-opus-5"

[pins.regressed]
harness = "claude-code"
version = "2.1.284"  # hypothetical next release; the simulated runner installs nothing
model = "anthropic/claude-opus-5"
